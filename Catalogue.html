<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image:url("abcx.jpg");
        }
        nav {
            background-color: #333;
            padding: 10px 0;
            display: flex;
            justify-content: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            padding: 10px;
        }
        nav a:hover {
            background-color: #555;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        .book {
            display: inline-block;
            margin: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .book img {
            max-width: 150px;
            display: block;
            margin: 0 auto;
        }
        .book h3 {
            font-size: 18px;
            margin: 10px 0;
        }
        .book button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        .book button:hover {
            background-color: #218838;
        }
        .cart {
            margin-top: 20px;
        }
        .cart-item {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#catalogue">Catalogue</a>
        <a href="#cart">Cart</a>
        <a href="#contact">Contact</a>
    </nav>

    <div id="home" class="container">
        <h1>Welcome to Our Book Store</h1>
        <p>Find your favorite books in our catalogue!</p>
    </div>

    <div id="catalogue" class="container">
        <h2>Catalogue</h2>
        <div class="book">
            <img src="https://via.placeholder.com/150" alt="Book 1">
            <h3>Book Title 1</h3>
            <p>Price: $10</p>
            <button onclick="addToCart('Book Title 1', 10)">Add to Cart</button>
        </div>
        <div class="book">
            <img src="https://via.placeholder.com/150" alt="Book 2">
            <h3>Book Title 2</h3>
            <p>Price: $15</p>
            <button onclick="addToCart('Book Title 2', 15)">Add to Cart</button>
        </div>
        <div class="book">
            <img src="https://via.placeholder.com/150" alt="Book 3">
            <h3>Book Title 3</h3>
            <p>Price: $20</p>
            <button onclick={addToCart()}>Add to Cart</button>
        </div>
    </div>

    <div id="cart" class="container">
        <h2>Your Cart</h2>
        <div class="cart"></div>
    </div>

    <div id="contact" class="container">
        <h2>Contact Us</h2>
        <p>Email: contact@bookstore.com</p>
        <p>Phone: +1 234 567 890</p>
    </div>

    <script>
        const cart = [];

        function addToCart(title, price) {
            cart.push({ title, price });
        
            alert(`${title} has been added to your cart!`);
        }

        function updateCart() {
            const cartContainer = document.querySelector('.cart');
            cartContainer.innerHTML = '';

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p>Your cart is empty.</p>';
            } else {
                cart.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `
                        <p>${item.title} - $${item.price}</p>
                        <button onclick="removeFromCart(${index})">Remove</button>
                    `;
                    cartContainer.appendChild(div);
                });

                const total = cart.reduce((sum, item) => sum + item.price, 0);
                const totalDiv = document.createElement('div');
                totalDiv.innerHTML = <h3>Total: $${total}</h3>;
                cartContainer.appendChild(totalDiv);
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }
    </script>
</body>
</html>
